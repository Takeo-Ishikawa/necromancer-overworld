name: Necromancer Character 3D Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/**'
      - '.github/workflows/character-model-preview.yml'

jobs:
  character-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libosmesa6
          blender --version
          /usr/bin/python3 -c 'import numpy; print(numpy.__version__)'

      - name: Generate editable character and FBX
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python tools/blender/generate_necromancer_083.py

      - name: Apply 0.8.4 anatomy and concept art refinements
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup tools/blender/character_base.blend --python tools/blender/sculpt_necromancer_084.py

      - name: Apply 0.8.5 face and hairstyle redesign
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup tools/blender/character_base.blend --python tools/blender/sculpt_necromancer_085.py

      - name: Apply 0.8.6 silhouette and cloth refinements
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup tools/blender/character_base.blend --python tools/blender/sculpt_necromancer_086.py

      - name: Render front side and back inspection images
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup tools/blender/character_base.blend --python tools/blender/render_character_turnaround.py

      - name: Validate generated files
        run: |
          test -s tools/blender/character_base.blend
          test -s tools/blender/character_base.fbx
          test -s tools/blender/character_front.png
          test -s tools/blender/character_side.png
          test -s tools/blender/character_back.png
          test -s tools/blender/character_head_front.png
          test -s tools/blender/character_head_threequarter.png
          ls -lh tools/blender/character_base.blend tools/blender/character_base.fbx

      - name: Upload Blender and Unity-ready FBX
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-character-0-8-6-silhouette-cloth
          path: |
            tools/blender/character_base.blend
            tools/blender/character_base.fbx
            tools/blender/character_front.png
            tools/blender/character_side.png
            tools/blender/character_back.png
            tools/blender/character_head_front.png
            tools/blender/character_head_threequarter.png
          if-no-files-found: error
          retention-days: 14
