name: Necromancer 0.9.10 Garment and Leather Accessories

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/realistic_hero_0910/**'
      - '.github/workflows/realistic-character-preview-0910.yml'

jobs:
  adult-character-0910:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6

      - name: Official Blender Studio Human Base Meshes CC0 v1.4.1
        run: |
          mkdir -p tools/blender/anatomical/_source_bundle
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o /tmp/human-base-meshes-v1.4.1.zip
          unzip -t /tmp/human-base-meshes-v1.4.1.zip | tail -n 2
          unzip -q /tmp/human-base-meshes-v1.4.1.zip -d tools/blender/anatomical/_source_bundle

      - name: Cache Blender 4.5.15 LTS
        uses: actions/cache@v4
        id: blender-cache
        with:
          path: /opt/blender-4.5.15
          key: official-blender-linux-x64-v4.5.15

      - name: Install official Blender on cache miss
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.15-linux-x64.tar.xz
          mkdir -p /opt/blender-4.5.15
          tar -xf /tmp/blender-4.5.15-linux-x64.tar.xz --strip-components=1 -C /opt/blender-4.5.15

      - name: Build and render 0.9.10 grown-up character costume
        run: |
          /opt/blender-4.5.15/blender --background --factory-startup --python tools/blender/realistic_hero_0910/assemble_realistic_hero_0910.py

      - name: Verify anatomical invariants, seams and genuine exports
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('tools/blender/realistic_hero_0910/output')
          m=json.loads((p/'source_metadata.json').read_text(encoding='utf-8'))
          assert m['base_collection']=='Body Male - Realistic'
          assert m['license']=='CC0-1.0' and m['bundle_version']=='1.4.1'
          assert (m['body_vertices'],m['body_faces'])==(10582,10590)
          assert m['body_digest_before']==m['body_digest_after']
          assert m['original_eye_hashes_unchanged'] is True
          assert m['connected_garment_mesh_count']==1
          assert (m['trousers_vertices'],m['trousers_faces'])==(1122,1086)
          assert m['side_seam_count']==2
          assert len(m['hem_seam_endpoint_distances_m'])==2
          assert all(x<.026 for x in m['hem_seam_endpoint_distances_m'])
          assert m['max_control_jump_m']<.12
          assert m['prior_seams_hidden'] is True
          assert m['previous_pouch_parts_hidden']>=6
          assert m['rounded_pouch_count']==2 and m['pouch_gear_parts']>=10
          assert m['original_bracer_count']==2
          assert m['new_bracer_stitch_curves']>=2
          assert m['max_bracer_stitch_m']<.027
          assert m['rigged'] is False and m['unity_character_replaced'] is False
          for fname in (
            'necromancer_realistic_0910.blend','necromancer_realistic_0910.fbx',
            'hero_front.png','hero_side.png','hero_back.png','hero_threequarter.png',
            'hero_hip_front.png','hero_pouch_threequarter.png',
            'hero_seam_side.png','hero_bracer_detail.png'
          ):
            f=p/fname
            assert f.exists() and f.stat().st_size>10000, fname
          print('VALID 0.9.10: unchanged adult CC0, connected pants, hem-reaching seams, editable leather objects')
          PY

      - name: Upload Blender, FBX, JSON and eight authentic views
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-realistic-0-9-10-garment-accessories
          path: |
            tools/blender/realistic_hero_0910/output/*.blend
            tools/blender/realistic_hero_0910/output/*.fbx
            tools/blender/realistic_hero_0910/output/*.png
            tools/blender/realistic_hero_0910/output/*.json
          retention-days: 14
          if-no-files-found: error
