name: Necromancer 0.9.7 Independent Tailoring and Crown Hair

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/realistic_hero_097/**'
      - '.github/workflows/realistic-character-preview-097.yml'

jobs:
  adult-tailoring-097:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Blender Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6

      - name: Official CC0 anatomical source
        run: |
          mkdir -p tools/blender/anatomical/_source_bundle
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o /tmp/human-base-meshes-v1.4.1.zip
          unzip -t /tmp/human-base-meshes-v1.4.1.zip | tail -n 2
          unzip -q /tmp/human-base-meshes-v1.4.1.zip -d tools/blender/anatomical/_source_bundle

      - name: Cache Blender 4.5.15 LTS
        uses: actions/cache@v4
        id: blender-cache
        with:
          path: /opt/blender-4.5.15
          key: official-blender-linux-x64-v4.5.15

      - name: Install official Blender if needed
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.15-linux-x64.tar.xz
          mkdir -p /opt/blender-4.5.15
          tar -xf /tmp/blender-4.5.15-linux-x64.tar.xz --strip-components=1 -C /opt/blender-4.5.15

      - name: Generate independent fabric leg loops and upper hair
        run: |
          /opt/blender-4.5.15/blender --background --factory-startup --python tools/blender/realistic_hero_097/assemble_realistic_hero_097.py

      - name: Validate original adult anatomy and exported assets
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('tools/blender/realistic_hero_097/output')
          m=json.loads((p/'source_metadata.json').read_text())
          assert m['license']=='CC0-1.0'
          assert m['bundle_version']=='1.4.1'
          assert m['base_collection']=='Body Male - Realistic'
          assert (m['body_vertices'],m['body_faces'])==(10582,10590)
          assert m['body_coordinate_sha256_before']==m['body_coordinate_sha256_after']
          assert m['original_eye_hashes_unchanged'] is True
          assert m['original_garment_faces_retained_hidden']>900
          assert m['upper_pelvis_source_faces']>200
          assert m['independent_leg_count']==2
          assert len(m['independent_leg_quads'])==2
          assert all(x>=700 for x in m['independent_leg_quads'])
          assert m['leg_ring_count']>=24 and m['leg_ring_vertices']>=24
          assert m['fabric_cuff_count']==2
          assert m['side_stitch_curve_count']==2
          assert m['independent_loft_experiment_hidden'] is True
          assert m['visible_seamless_garment']=='096-source-quads-with-097-woven-material'
          assert m['base_fibre_strands']==1760
          assert m['added_swept_upper_fibers']==180
          assert m['added_upper_groom_groups']==2
          assert m['hair_root_min_z']>1.785
          assert m['rigged'] is False and m['unity_character_replaced'] is False
          for filename in (
            'necromancer_realistic_097.blend','necromancer_realistic_097.fbx',
            'hero_front.png','hero_side.png','hero_back.png','hero_threequarter.png',
            'hero_face_front.png','hero_face_threequarter.png',
            'hero_hair_back_detail.png','hero_trousers_detail.png'
          ):
            f=p/filename
            assert f.exists() and f.stat().st_size>10000,filename
          print('VALIDATED 0.9.7: independent cloth, CC0 anatomy preserved, swept upper hair')
          PY

      - name: Upload editable Blender FBX metadata and eight real renders
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-realistic-0-9-7-independent-tailoring
          path: |
            tools/blender/realistic_hero_097/output/*.blend
            tools/blender/realistic_hero_097/output/*.fbx
            tools/blender/realistic_hero_097/output/*.png
            tools/blender/realistic_hero_097/output/*.json
          retention-days: 14
          if-no-files-found: error
