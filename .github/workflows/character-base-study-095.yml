name: Necromancer 0.9.5 CC0 Face Base Comparison

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/studies/**'
      - '.github/workflows/character-base-study-095.yml'

jobs:
  compare-cc0-male-bases:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6

      - name: Download official Blender Studio Human Base Meshes v1.4.1 (CC0)
        run: |
          mkdir -p tools/blender/anatomical/_source_bundle
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o /tmp/human-base-meshes-v1.4.1.zip
          unzip -t /tmp/human-base-meshes-v1.4.1.zip | tail -n 2
          unzip -q /tmp/human-base-meshes-v1.4.1.zip -d tools/blender/anatomical/_source_bundle

      - name: Cache Blender 4.5.15 LTS
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.5.15
          key: official-blender-linux-x64-v4.5.15

      - name: Install Blender 4.5.15 LTS if needed
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.15-linux-x64.tar.xz
          mkdir -p /opt/blender-4.5.15
          tar -xf /tmp/blender-4.5.15-linux-x64.tar.xz --strip-components=1 -C /opt/blender-4.5.15

      - name: Render original CC0 realistic versus stylized face
        run: |
          /opt/blender-4.5.15/blender --background --factory-startup --python tools/blender/studies/compare_cc0_male_bases_095.py

      - name: Verify genuine source, image views and source preservation
        run: |
          python3 - <<'PY'
          import pathlib, json
          p=pathlib.Path('tools/blender/studies/output')
          m=json.loads((p/'source_metadata.json').read_text())
          assert m['license']=='CC0-1.0'
          assert m['bundle_version']=='1.4.1'
          assert m['rigged'] is False and m['unity_character_replaced'] is False
          assert m['variants']['stylized']['n_vertices']>10000
          assert m['variants']['realistic']['n_vertices']>10000
          for name in ('stylized','realistic'):
            assert m['variants'][name]['n_faces']>9000
            assert m['variants'][name]['face_vertices']>200
            for view in ('front','face_front','face_profile','face_threequarter'):
              img=p/f'{name}_{view}.png'
              assert img.exists() and img.stat().st_size>10000,img
          for file in ('official_CC0_male_face_comparison_095.blend',
                       'official_realistic_male_CC0_candidate_095.fbx'):
            f=p/file
            assert f.exists() and f.stat().st_size>10000,file
          print('VALIDATED topology identical:',m['topology_identical_loop_order'],
                'stylized:',m['variants']['stylized']['n_vertices'],
                'realistic:',m['variants']['realistic']['n_vertices'])
          PY

      - name: Upload real anatomy alternatives, comparison renders and Blender files
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-0-9-5-cc0-face-base-study
          path: |
            tools/blender/studies/output/*.blend
            tools/blender/studies/output/*.fbx
            tools/blender/studies/output/*.png
            tools/blender/studies/output/*.json
          retention-days: 14
          if-no-files-found: error
