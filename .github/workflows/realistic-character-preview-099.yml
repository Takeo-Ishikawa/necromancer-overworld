name: Necromancer 0.9.9 Smooth Garment and Seam Review

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/realistic_hero_099/**'
      - '.github/workflows/realistic-character-preview-099.yml'

jobs:
  adult-cloth-099:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Blender Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6
      - name: Source CC0 Blender Studio Realistic Male v1.4.1
        run: |
          mkdir -p tools/blender/anatomical/_source_bundle
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o /tmp/human-base-meshes-v1.4.1.zip
          unzip -t /tmp/human-base-meshes-v1.4.1.zip | tail -n 2
          unzip -q /tmp/human-base-meshes-v1.4.1.zip -d tools/blender/anatomical/_source_bundle
      - name: Cache official Blender 4.5.15 LTS
        uses: actions/cache@v4
        id: blender-cache
        with:
          path: /opt/blender-4.5.15
          key: official-blender-linux-x64-v4.5.15
      - name: Install Blender if cache absent
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.15-linux-x64.tar.xz
          mkdir -p /opt/blender-4.5.15
          tar -xf /tmp/blender-4.5.15-linux-x64.tar.xz --strip-components=1 -C /opt/blender-4.5.15
      - name: Generate front drape and continuous raycast seams
        run: |
          /opt/blender-4.5.15/blender --background --factory-startup --python tools/blender/realistic_hero_099/assemble_realistic_hero_099.py
      - name: Validate original anatomy and exported assets
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('tools/blender/realistic_hero_099/output')
          m=json.loads((p/'source_metadata.json').read_text())
          assert m['base_collection']=='Body Male - Realistic'
          assert m['license']=='CC0-1.0' and m['bundle_version']=='1.4.1'
          assert (m['body_vertices'],m['body_faces'])==(10582,10590)
          assert m['body_digest_before']==m['body_digest_after']
          assert m['eye_digests_unchanged'] is True
          assert m['garment_faces']>900 and m['garment_components']==1
          assert len(m['garment_shape_keys'])==3
          assert m['pelvic_vertices_refined']>=90
          assert m['seam_curve_count']==2 and m['seam_total_raycast_hits']==164
          assert m['max_seam_control_segment_m']<.10
          assert m['old_zigzag_seams_hidden'] and m['old_disconnected_garments_hidden']
          assert m['uv_layers']>=1
          assert m['rigged'] is False and m['unity_character_replaced'] is False
          for fname in (
            'necromancer_realistic_099.blend','necromancer_realistic_099.fbx',
            'hero_front.png','hero_side.png','hero_back.png','hero_threequarter.png',
            'hero_face_threequarter.png','hero_trousers_front.png','hero_trousers_side.png',
            'hero_seam_side.png'
          ):
            f=p/fname
            assert f.exists() and f.stat().st_size>10000,fname
          print('VALID 0.9.9: unchanged CC0 face and body, one continuous cloth and surface-seam guides')
          PY
      - name: Upload editable files and eight real renders
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-realistic-0-9-9-garment-seam-refine
          path: |
            tools/blender/realistic_hero_099/output/*.blend
            tools/blender/realistic_hero_099/output/*.fbx
            tools/blender/realistic_hero_099/output/*.png
            tools/blender/realistic_hero_099/output/*.json
          retention-days: 14
          if-no-files-found: error
