name: Necromancer 0.9.11 Adult Bracer Edges and Trouser Drape

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/realistic_hero_0911/**'
      - '.github/workflows/realistic-character-preview-0911.yml'

jobs:
  realistic-bracers-0911:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6

      - name: Download Blender Studio official CC0 adult source
        run: |
          mkdir -p tools/blender/anatomical/_source_bundle
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o /tmp/human-base-meshes-v1.4.1.zip
          unzip -t /tmp/human-base-meshes-v1.4.1.zip | tail -n 2
          unzip -q /tmp/human-base-meshes-v1.4.1.zip -d tools/blender/anatomical/_source_bundle

      - name: Cache official Blender 4.5.15 LTS
        uses: actions/cache@v4
        id: blender-cache
        with:
          path: /opt/blender-4.5.15
          key: official-blender-linux-x64-v4.5.15

      - name: Install official Blender if cache absent
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.15-linux-x64.tar.xz
          mkdir -p /opt/blender-4.5.15
          tar -xf /tmp/blender-4.5.15-linux-x64.tar.xz --strip-components=1 -C /opt/blender-4.5.15

      - name: Assemble v0.9.11 anatomical CC0 model and true model previews
        run: |
          /opt/blender-4.5.15/blender --background --factory-startup --python tools/blender/realistic_hero_0911/assemble_realistic_hero_0911.py

      - name: Verify adult anatomy, bound leather panels and real exports
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('tools/blender/realistic_hero_0911/output')
          m=json.loads((p/'source_metadata.json').read_text(encoding='utf-8'))
          assert m['base_collection']=='Body Male - Realistic'
          assert m['license']=='CC0-1.0' and m['bundle_version']=='1.4.1'
          assert (m['body_vertices'],m['body_faces'])==(10582,10590)
          assert m['body_hash_before']==m['body_hash_after']
          assert m['original_eye_hashes_unchanged'] is True
          assert m['connected_trouser_components']==1
          assert (m['trouser_vertices'],m['trouser_faces'])==(1122,1086)
          assert len(m['trouser_shape_keys'])==4
          assert m['pelvis_vertices_adjusted']>=35
          assert m['original_bracer_count']==2
          assert m['leather_binding_objects']==4
          assert m['rejected_raised_rim_hidden'] is True
          assert m['visible_guard_material_border_faces']>=25
          assert all(len(v)==2 for v in m['binding_edge_counts'].values())
          assert m['max_binding_edge_length_m']<.04
          assert m['new_guard_stitches']>=8
          assert m['max_guard_stitch_length_m']<=.006
          assert m['old_guard_stitches_hidden'] is True
          assert m['new_belt_keepers']==2
          assert m['pouch_bodies_preserved']==2
          assert m['rigged'] is False and m['unity_character_replaced'] is False
          for fname in (
            'necromancer_realistic_0911.blend','necromancer_realistic_0911.fbx',
            'hero_front.png','hero_side.png','hero_back.png','hero_threequarter.png',
            'hero_bracer_front.png','hero_bracer_threequarter.png',
            'hero_pelvic_front.png','hero_belt_details.png'
          ):
            f=p/fname
            assert f.exists() and f.stat().st_size>10000, fname
          print('PASS: unmodified official adult anatomy, fitted leather trim and editable pelvis shape key')
          PY

      - name: Upload original editable scene, FBX and eight inspection views
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-realistic-0-9-11-bracer-trim
          path: |
            tools/blender/realistic_hero_0911/output/*.blend
            tools/blender/realistic_hero_0911/output/*.fbx
            tools/blender/realistic_hero_0911/output/*.png
            tools/blender/realistic_hero_0911/output/*.json
          retention-days: 14
          if-no-files-found: error
