name: Limpar compilacoes antigas

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/limpar-compilacoes.yml'
  workflow_run:
    workflows:
      - 'Necromancer Overworld Android APK'
      - 'Necromancer Overworld Windows EXE'
    types: [completed]
  schedule:
    - cron: '37 4 * * *'

permissions:
  actions: write

concurrency:
  group: limpar-compilacoes
  cancel-in-progress: false

jobs:
  limpeza:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preservar ultimo build por fluxo e remover antigos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          
          root = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "safe-artifact-retention"}
          def api(path, method="GET"):
              with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers, method=method), timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          
          artifacts = []
          page = 1
          while True:
              batch = api(f"/actions/artifacts?per_page=100&page={page}")["artifacts"]
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          active = [a for a in artifacts if not a.get("expired") and (a.get("workflow_run") or {}).get("id")]
          # Deployments de Pages e arquivos fora das execuções ficam preservados.
          managed = [a for a in active if a["name"] != "github-pages"]
          runs = {}
          for a in managed:
              rid = a["workflow_run"]["id"]
              if rid not in runs:
                  runs[rid] = api(f"/actions/runs/{rid}")
          groups = {}
          for rid, run in runs.items():
              groups.setdefault(run["workflow_id"], []).append(run)
          keep = set()
          for workflow, candidates in groups.items():
              successful = [r for r in candidates if r["conclusion"] == "success"]
              selected = max(successful or candidates, key=lambda r: (r["created_at"], r["id"]))
              keep.add(selected["id"])
              print(f"PRESERVADO workflow={workflow} run={selected['id']} nome={selected['name']}")
          old = [a for a in managed if a["workflow_run"]["id"] not in keep
                 and runs[a["workflow_run"]["id"]]["status"] == "completed"]
          removed = 0
          count = 0
          for a in old:
              try:
                  api(f"/actions/artifacts/{a['id']}", "DELETE")
                  removed += a["size_in_bytes"]
                  count += 1
                  print(f"REMOVIDO {a['name']} id={a['id']} bytes={a['size_in_bytes']}")
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          print(f"RESULTADO removidos={count} bytes={removed} preservados={len(managed)-len(old)}")
          
          PY
