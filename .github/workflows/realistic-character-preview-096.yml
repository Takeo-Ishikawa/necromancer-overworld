name: Necromancer 0.9.6 Adult CC0 Groom and Tailoring

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/realistic_hero_096/**'
      - '.github/workflows/realistic-character-preview-096.yml'

jobs:
  groom-tailored-adult:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6

      - name: Download Blender Studio CC0 official adult source v1.4.1
        run: |
          mkdir -p tools/blender/anatomical/_source_bundle
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o /tmp/human-base-meshes-v1.4.1.zip
          unzip -t /tmp/human-base-meshes-v1.4.1.zip | tail -n 2
          unzip -q /tmp/human-base-meshes-v1.4.1.zip -d tools/blender/anatomical/_source_bundle

      - name: Cache official Blender 4.5.15 LTS
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.5.15
          key: official-blender-linux-x64-v4.5.15

      - name: Install Blender if cache unavailable
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.15-linux-x64.tar.xz
          mkdir -p /opt/blender-4.5.15
          tar -xf /tmp/blender-4.5.15-linux-x64.tar.xz --strip-components=1 -C /opt/blender-4.5.15

      - name: Groom and tailor 0.9.6 without editing anatomy
        run: |
          /opt/blender-4.5.15/blender --background --factory-startup --python tools/blender/realistic_hero_096/assemble_realistic_hero_096.py

      - name: Verify preservation and actual modeled assets
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('tools/blender/realistic_hero_096/output')
          m=json.loads((p/'source_metadata.json').read_text())
          assert m['base_collection']=='Body Male - Realistic'
          assert m['license']=='CC0-1.0' and m['bundle_version']=='1.4.1'
          assert (m['body_vertices'],m['body_faces'])==(10582,10590)
          assert m['body_coordinate_sha256_before']==m['body_coordinate_sha256_after']
          assert m['source_eye_mesh_hashes_unchanged'] is True
          assert m['tailored_trouser_quad_faces']>900
          assert m['tailored_trouser_vertices']>=600
          assert m['hair_clumps']==103
          assert m['hair_clump_root_min_z']>1.775
          assert len(m['separated_3d_hair_groups'])==4
          assert m['highlight_splines']>20
          assert m['hair_clump_mesh_faces']>4000
          assert m['separate_cuff_stitch_curves']==2
          assert m['rigged'] is False and m['unity_character_replaced'] is False
          for filename in (
            'necromancer_realistic_096.blend','necromancer_realistic_096.fbx',
            'hero_front.png','hero_side.png','hero_back.png','hero_threequarter.png',
            'hero_face_front.png','hero_face_threequarter.png',
            'hero_hair_back_detail.png','hero_trousers_detail.png'
          ):
            file=p/filename
            assert file.exists() and file.stat().st_size>10000, filename
          print('VALIDATED 0.9.6: unchanged CC0 adult anatomy with real 3D locks and cloth tailoring')
          PY

      - name: Upload editable Blender FBX metrics and eight real inspection views
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-realistic-0-9-6-cc0-groom-tailoring
          path: |
            tools/blender/realistic_hero_096/output/*.blend
            tools/blender/realistic_hero_096/output/*.fbx
            tools/blender/realistic_hero_096/output/*.png
            tools/blender/realistic_hero_096/output/*.json
          if-no-files-found: error
          retention-days: 14
