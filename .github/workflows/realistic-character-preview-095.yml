name: Necromancer 0.9.5 Realistic CC0 Hero Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/realistic_hero_095/**'
      - '.github/workflows/realistic-character-preview-095.yml'

jobs:
  realistic-hero-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xz-utils libgl1 libxi6 libxrender1 libxkbcommon-x11-0 libsm6

      - name: Download official CC0 Human Base Meshes v1.4.1
        run: |
          mkdir -p tools/blender/anatomical/_source_bundle
          curl -fL --retry 3 --retry-delay 4 --connect-timeout 30 \
            'https://mirror.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o /tmp/human-base-meshes-v1.4.1.zip
          unzip -t /tmp/human-base-meshes-v1.4.1.zip | tail -n 2
          unzip -q /tmp/human-base-meshes-v1.4.1.zip -d tools/blender/anatomical/_source_bundle

      - name: Cache official Blender 4.5.15 LTS
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.5.15
          key: official-blender-linux-x64-v4.5.15

      - name: Install official Blender if cache miss
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            'https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz' \
            -o /tmp/blender-4.5.15-linux-x64.tar.xz
          mkdir -p /opt/blender-4.5.15
          tar -xf /tmp/blender-4.5.15-linux-x64.tar.xz --strip-components=1 -C /opt/blender-4.5.15

      - name: Build editable realistic-body costume and render real geometry
        run: |
          /opt/blender-4.5.15/blender --background --factory-startup --python tools/blender/realistic_hero_095/assemble_realistic_hero_095.py

      - name: Verify realistic topology, separate garments and real exports
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('tools/blender/realistic_hero_095/output')
          meta=json.loads((p/'source_metadata.json').read_text())
          assert meta['base_collection']=='Body Male - Realistic'
          assert meta['license']=='CC0-1.0'
          assert meta['body_vertices']==10582 and meta['body_faces']==10590
          assert meta['body_vertices_after']==meta['body_vertices']
          assert meta['body_faces_after']==meta['body_faces']
          assert meta['source_eye_meshes']==2
          assert meta['outfit_trouser_faces']>800
          assert meta['bracer_faces']>80
          assert meta['hair_locks']>=400
          assert meta['scalp_faces']>=60
          assert meta['rigged'] is False and meta['unity_character_replaced'] is False
          for filename in (
            'necromancer_realistic_095.blend','necromancer_realistic_095.fbx',
            'hero_front.png','hero_side.png','hero_back.png',
            'hero_threequarter.png','hero_face_front.png',
            'hero_face_threequarter.png'
          ):
            f=p/filename
            assert f.exists() and f.stat().st_size>10000,filename
          print('VALID REALISTIC CC0 HERO:',meta['body_vertices'],'vertices',meta['body_faces'],'faces')
          PY

      - name: Upload editable realistic hero CC0 candidate and six genuine renders
        uses: actions/upload-artifact@v4
        with:
          name: necromancer-realistic-hero-0-9-5-cc0-preview
          path: |
            tools/blender/realistic_hero_095/output/*.blend
            tools/blender/realistic_hero_095/output/*.fbx
            tools/blender/realistic_hero_095/output/*.png
            tools/blender/realistic_hero_095/output/*.json
          retention-days: 14
          if-no-files-found: error
